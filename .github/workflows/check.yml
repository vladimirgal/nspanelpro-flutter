name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_seasonal_visibility.py .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The panel is arm64; one APK is all it needs, and one is all we keep.
      - name: Set separate test application ID
        run: |
          sed -i 's/applicationId = "nl.mennovanhout.nspanel"/applicationId = "sk.vladimirgal.nspanel.test"/' android/app/build.gradle.kts
          grep 'applicationId =' android/app/build.gradle.kts
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: nspanel-app-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
